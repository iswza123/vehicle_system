services:
  - type: web
    name: vehicle-system-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn vehicle_system.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: vehicle-db
          property: connectionString
databases:
  - name: vehicle-db
    plan: free
